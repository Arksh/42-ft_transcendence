services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  realtime:
    build: ./realtime
    ports:
      - '0.0.0.0:42069:42069'
    environment:
      PORT: 42069
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    ports:
      - '0.0.0.0:3000:3000'
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - '80:80'
    depends_on:
      - engine
      - realtime
    restart: unless-stopped
